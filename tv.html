(()=>{'use strict';const slides=[

];let i=0,lang='fr',playing=true,timer=null;const $=id=>document.getElementById(id);const languages=window.GUIDE_I18N||{};

function show(){const s=slides[i],t=s[lang]||s.fr;$('eyebrow').textContent=`${s.icon} ${t[0]}`;$('heading').textContent=t[1];$('summary').textContent=t[2];$('visual').src=s.img;$('visual').alt='';$('dots').innerHTML=slides.map((_,j)=>`<span class="${j===i?'current':''}"></span>`).join('');const q={fr:['Scannez et explorez.','Le guide complet sur votre téléphone.','📍 Départ : 21 avenue des Alliés, Montbéliard','Découvrir le guide ↗'],en:['Scan and explore.','The complete guide on your phone.','📍 Start: 21 avenue des Alliés, Montbéliard','Open the guide ↗'],de:['Scannen & entdecken.','Der komplette Guide auf Ihrem Smartphone.','📍 Start: 21 avenue des Alliés, Montbéliard','Guide öffnen ↗'],zh:['扫码探索。','完整指南尽在手机中。','📍 起点：21 avenue des Alliés, Montbéliard','打开指南 ↗']}[lang];$('qrhead').textContent=q[0];$('qrtext').textContent=q[1];$('from').textContent=q[2];$('cta').textContent=q[3];$('back').textContent={fr:'← Guide',en:'← Guide',de:'← Guide',zh:'← 指南'}[lang];$('cta').href='index.html?lang='+lang;$('back').href='index.html?lang='+lang;}
